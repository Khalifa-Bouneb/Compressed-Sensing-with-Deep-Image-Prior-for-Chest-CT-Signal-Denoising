# Configuration for DIP Reconstruction

# Image parameters
image:
  height: 256
  width: 256
  channels: 1  # Grayscale for CT images

# Compressed sensing parameters
compressed_sensing:
  sampling_rate: 0.3  # Keep 30% of measurements
  mask_type: 'random'  # Options: 'random', 'cartesian', 'radial'
  noise_level: 0.01  # Standard deviation of Gaussian noise

# Deep Image Prior network parameters
network:
  input_channels: 32  # Number of channels in input noise
  output_channels: 1  # Grayscale output
  num_channels_down: [128, 128, 128, 128, 128]
  num_channels_up: [128, 128, 128, 128, 128]
  num_channels_skip: [4, 4, 4, 4, 4]

# Optimization parameters
optimization:
  num_iterations: 5000
  learning_rate: 0.01
  optimizer: 'Adam'  # Options: 'Adam', 'SGD'
  log_interval: 100  # Logging frequency

# Device settings
device:
  use_cuda: true  # Use GPU if available
  gpu_id: 0  # GPU device ID

# Output settings
output:
  save_results: true
  save_convergence: true
  save_intermediate: false  # Save intermediate results during optimization
  intermediate_interval: 500
  output_dir: 'output'
